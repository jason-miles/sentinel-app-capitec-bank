command:
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: FRAUD_CATALOG
    value: "elexon_app_for_settlement_acc_catalog"
  - name: FRAUD_GOLD_SCHEMA
    value: "capitec_fraud_aml_gold"
  - name: FRAUD_SILVER_SCHEMA
    value: "capitec_fraud_aml_silver"
  # Serving warehouse the app queries run on — capitec-sentinel-wh, DEDICATED to this
  # app (do NOT share: `databricks warehouses set-permissions` overwrites the ACL and
  # would evict another app's SP, causing 500s). Grant the app SP CAN_USE via
  # `update-permissions` (additive).
  - name: FRAUD_WAREHOUSE_ID
    value: "10fbc0a24b3e418c"
  # Capitec-specific Genie space + dashboard, both pointed at capitec_fraud_aml_* and
  # provisioned during deployment (see DEPLOY.md step 4).
  - name: SENTINEL_GENIE_SPACE
    value: "01f194ad316e127191fec45fdd5fb6bc"
  - name: SENTINEL_DASHBOARD_ID
    value: "01f194ad41b618fa8342f8a851b45507"
  - name: DATABRICKS_HOST
    value: "https://fevm-elexon-app-for-settlement-acc.cloud.databricks.com"
